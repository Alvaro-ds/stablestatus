name: Daily ESMA ingest

on:
  schedule:
  - cron: "17 6 * * *"
  - cron: "47 13 * * *"
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Exit with code 1 before downloading anything (tests the failure alert)"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - name: Simulate failure
        if: inputs.simulate_failure
        run: |
          echo "simulate_failure=true: exiting before download"
          exit 1

      - run: pnpm ingest

      - run: pnpm changelog

      - name: Commit data changes
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data CHANGELOG-data.md
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          day=$(jq -r '.at[0:10]' data/last-run.json)
          critical=$(jq -r '.critical' data/last-run.json)
          msg="chore(data): daily ESMA ingest $day"
          if [ "$critical" -gt 0 ]; then
            msg="$msg [critical: $critical]"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$msg"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            if git push; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push attempt $attempt failed; rebasing on remote."
            git pull --rebase
          done
          echo "Push failed after 3 attempts."
          exit 1

      # Alerts. ESMA values never go through ${{ }} inside run: they are read from
      # files with jq and passed to gh via --body-file.

      - name: Open issue for critical changes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          critical=$(jq -r '.critical' data/last-run.json)
          if [ "$critical" -eq 0 ]; then
            echo "No critical changes."
            exit 0
          fi
          events=$(jq -r '.events' data/last-run.json)
          day=$(jq -r '.at[0:10]' data/last-run.json)
          gh label create critical-change --color B60205 \
            --description "Critical change in the ESMA register" 2>/dev/null || true
          {
            echo "The daily ingest on $day detected $critical critical change(s)."
            echo
            echo "Commit: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$COMMIT_SHA"
            echo
            echo "~~~~json"
            tail -n "$events" data/changes.jsonl | jq -c 'select(.severity == "critical")' | tr -d '~'
            echo "~~~~"
            sed -n '/^---$/,$p' CHANGELOG-data.md
          } > "$RUNNER_TEMP/issue-body.md"
          gh issue create --title "Critical change in ESMA register ($day)" \
            --label critical-change --body-file "$RUNNER_TEMP/issue-body.md"

      - name: Close failure issue on recovery
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          number=$(gh issue list --label ingest-failure --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "Recovered on $(date -u +%F)."
          fi

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="Daily ingest failed on $(date -u +%F): $run_url"
          gh label create ingest-failure --color D93F0B \
            --description "The daily ESMA ingest failed" 2>/dev/null || true
          number=$(gh issue list --label ingest-failure --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "Daily ingest failed" --label ingest-failure --body "$body"
          fi
